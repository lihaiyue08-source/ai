        /* ========== Reset & Base ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        /* ========== Scrollbar ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #12121a; }
        ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

        /* ========== Header ========== */
        header {
            background: linear-gradient(135deg, #0d0d14 0%, #14141f 50%, #0d0d14 100%);
            border-bottom: 1px solid #1e1e2e;
            padding: 50px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(59,130,246,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            position: relative;
        }
        header p {
            color: #888;
            font-size: 1.1rem;
            margin-top: 10px;
            position: relative;
        }

        /* ========== Ad Banner (Top) ========== */
        .ad-top {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
        }
        .ad-placeholder {
            background: linear-gradient(135deg, #14141f, #1a1a2e);
            border: 1px dashed #2a2a4a;
            border-radius: 12px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .ad-placeholder:hover {
            border-color: #3a3a6a;
            background: #18182a;
            color: #777;
        }
        .ad-placeholder .ad-badge {
            background: #f59e0b;
            color: #000;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* ========== Search Bar ========== */
        .search-section {
            max-width: 700px;
            margin: 30px auto 0;
            padding: 0 20px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #14141f;
            border: 1px solid #1e1e2e;
            border-radius: 14px;
            padding: 0 20px;
            transition: all 0.3s;
        }
        .search-box:focus-within {
            border-color: #3b3b6a;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .search-box svg { flex-shrink: 0; }
        .search-box input {
            flex: 1;
            background: none;
            border: none;
            padding: 16px 14px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
        }
        .search-box input::placeholder { color: #555; }

        /* ========== Category Tabs ========== */
        .category-bar {
            max-width: 1100px;
            margin: 28px auto 0;
            padding: 0 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .category-bar::-webkit-scrollbar { height: 3px; }
        .category-bar::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
        .category-btn {
            white-space: nowrap;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid #1e1e2e;
            background: #12121a;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 500;
        }
        .category-btn:hover {
            background: #1a1a2a;
            color: #ccc;
        }
        .category-btn.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2));
            border-color: #3b3b6a;
            color: #a5b4fc;
        }

        /* ========== Tool Grid ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        /* ========== Tool Card ========== */
        .tool-card {
            background: #12121a;
            border: 1px solid #1a1a2a;
            border-radius: 14px;
            padding: 22px 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover {
            border-color: #2a2a4e;
            background: #16161f;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .tool-card .icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .tool-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .tool-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #eee;
        }
        .tool-card .tag {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .tag.paid { background: rgba(250,204,21,0.15); color: #facc15; }
        .tag.freemium { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .tool-card p {
            color: #777;
            font-size: 0.9rem;
            line-height: 1.6;
            flex: 1;
            margin: 8px 0 14px;
        }
        .tool-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid #1a1a2a;
        }
        .tool-card .card-footer .category-label {
            font-size: 0.75rem;
            color: #555;
        }
        .tool-card .card-footer .visit-link {
            font-size: 0.85rem;
            color: #60a5fa;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-card .card-footer .visit-link:hover { color: #93bbfc; }

        .tool-card.ad-card {
            background: linear-gradient(135deg, #0f0f1a, #14142a);
            border-style: dashed;
            border-color: #2a2a4a;
            cursor: default;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 200px;
        }
        .tool-card.ad-card:hover {
            transform: none;
            border-color: #3a3a6a;
            background: linear-gradient(135deg, #121220, #181830);
        }
        .tool-card.ad-card .ad-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #555;
        }
        .tool-card.ad-card .ad-inner .ad-badge-lg {
            background: rgba(245,158,11,0.15);
            color: #f59e0b;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .tool-card.ad-card .ad-inner p { margin: 0; font-size: 0.85rem; color: #555; }

        /* ========== Footer ========== */
        footer {
            border-top: 1px solid #1a1a2a;
            padding: 30px 20px;
            text-align: center;
            color: #555;
            font-size: 0.85rem;
        }
        footer a { color: #60a5fa; }

        /* ========== Responsive ========== */
        @media (max-width: 640px) {
            header h1 { font-size: 1.8rem; }
            .tools-grid { grid-template-columns: 1fr; }
            .category-bar { gap: 6px; }
            .category-btn { padding: 6px 14px; font-size: 0.82rem; }
        }

        /* ========== Empty State ========== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }
        .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
        .empty-state p { font-size: 1rem; }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e2e;
            border: 1px solid #2a2a4a;
            padding: 12px 24px;
            border-radius: 12px;
            color: #ccc;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

        const AD_INTERVAL = 6;
        const withAds = [];
        for (let i = 0; i < filtered.length; i++) {
            withAds.push(filtered[i]);
            if ((i + 1) % AD_INTERVAL === 0 && i < filtered.length - 1) {
                withAds.push({ _ad: true, id: `ad-${i}` });
            }
        }

        if (withAds.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <p>没有找到匹配的工具，试试其他关键词吧</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = withAds.map(item => {
            if (item._ad) {
                return `
                    <div class="tool-card ad-card" onclick="showToast('📢 广告位招租 — 联系：ad@example.com')">
                        <div class="ad-inner">
                            <span class="ad-badge-lg">📢 广告</span>
                            <p>在这里推广你的 AI 产品<br/>触达上千名 AI 爱好者</p>
                        </div>
                    </div>
                `;
            }
            const tagClass = item.tag === 'free' ? 'free' : item.tag === 'paid' ? 'paid' : 'freemium';
            const tagLabel = item.tag === 'free' ? '免费' : item.tag === 'paid' ? '付费' : '免费增值';
            return `
                <div class="tool-card" onclick="window.open('${item.link}','_blank')">
                    <div class="card-header">
                        <div class="icon-wrap" style="background:${item.color}22; color:${item.color}">
                            ${categories.find(c => c.id === item.cat)?.icon || '🤖'}
                        </div>
                        <span class="tag ${tagClass}">${tagLabel}</span>
                    </div>
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <div class="card-footer">
                        <span class="category-label">${categories.find(c => c.id === item.cat)?.label || item.cat}</span>
                        <span class="visit-link">访问 →</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    //  ACTIONS
    // ============================================================
    function setCategory(id) {
        activeCategory = id;
        renderCategoryTabs();
        renderGrid();
    }

    function filterTools() {
        searchQuery = document.getElementById('searchInput').value;
        renderGrid();
    }

    function showToast(message) {
        const toastEl = document.getElementById('toast');
        toastEl.textContent = message;
        toastEl.classList.add('show');
        setTimeout(() => {
            toastEl.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        renderCategoryTabs();
        renderGrid();
    });
</script>

</body>
</html>
